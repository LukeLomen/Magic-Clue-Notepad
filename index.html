<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Clue Notepad</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./Images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="interactive_table.css">
  <link rel="stylesheet" href="interactive_button.css">
  <link rel="stylesheet" href="name_setup.css">
</head>

<body>
  <div id="name-setup">
    <h1 id="title">Magic Clue Notepad</h1>
    <h3>Enter Player Names in Clockwise Order</h3>
    <input id="playerName0" type="text" maxlength="15" placeholder="Your Name (optional)">
    <input id="playerName1" type="text" maxlength="15" placeholder="Player 2 Name">
    <input id="playerName2" type="text" maxlength="15" placeholder="Player 3 Name">
    <input id="playerName3" type="text" maxlength="15" placeholder="Player 4 Name (optional)">
    <input id="playerName4" type="text" maxlength="15" placeholder="Player 5 Name (optional)">
    <input id="playerName5" type="text" maxlength="15" placeholder="Player 6 Name (optional)">
  </div>
  <div id="top-container">
    <div id="interactive-table-container"></div>
  </div>
  <div id="control-panel" class="hidden">
    <div id="back-button-container" class="button-container"></div>
    <div id="suggestion-area">
      <div id="suggestion-text">
        <span id="main-text"></span>
        <span id="validation-text"></span>
      </div>
      <div id="suggestion-buttons-container" class="button-container"></div>
    </div>
    <div id="forward-button-container" class="button-container"></div>
  </div>

  <script type="module" src="table_symbols.js"></script>
  <script type="module" src="interactive_button.js"></script>
  <script type="module" src="interactive_table.js"></script>
  <script type="module" src="name_setup.js"></script>
  <script type="module" src="control_panel.js"></script>
  <script type="module" src="clue_cards.js"></script>
  <script type="module" src="clue_data.js"></script>
  <script type="module" src="game_manager.js"></script>
  <script type="module" src="index.js"></script>
</body>

</html>
